name: update-data

on:
  schedule:
    # Every 3 hours at :17 (off the top-of-hour cron stampede on GitHub).
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/update.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-haiku-4-5' }}
        run: python scripts/update.py

      - name: Commit if changed
        run: |
          git config user.name  "linuxprivesctoday-bot"
          git config user.email "bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain public/data.json)" ]]; then
            git add public/data.json
            git commit -m "data: auto-update $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          else
            echo "no changes"
          fi
